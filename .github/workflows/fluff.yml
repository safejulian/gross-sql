name: SQLFluff

on:
  - pull_request

jobs:
  lint-models:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"
      - name: install sqlfluff
        run: "pip install sqlfluff"
      - name: Get changed files
        id: get_file_changes
        uses: trilom/file-changes-action@v1.2.4
        with:
          output: ' '

      - name: Get changed .sql files in /models to lint
        id: get_files_to_lint
        shell: bash -l {0}
        run: |
          # Set the command in the $() brackets as an output to use in later steps
          echo "::set-output name=lintees::$(
          # Issue where grep regular expressions don't work as expected on the
          # Github Actions shell, check sql/ folder
          echo \
          $(echo ${STEPS_GET_FILE_CHANGES_OUTPUTS_FILES_MODIFIED} |
          tr -s ' ' '\n' |
          grep -E '^sql.*[.]sql$' |
          tr -s '\n' ' ') \
          $(echo ${STEPS_GET_FILE_CHANGES_OUTPUTS_FILES_ADDED} |
          tr -s ' ' '\n' |
          grep -E '^sql.*[.]sql$' |
          tr -s '\n' ' ')
          )"
        env:
          STEPS_GET_FILE_CHANGES_OUTPUTS_FILES_MODIFIED: ${{ steps.get_file_changes.outputs.files_modified }}
          STEPS_GET_FILE_CHANGES_OUTPUTS_FILES_ADDED: ${{ steps.get_file_changes.outputs.files_added }}

      - name: Lint SQL files
        id: sqlfluff_json
        if: steps.get_files_to_lint.outputs.lintees != ''
        shell: bash -l {0}
        run: |
          sqlfluff lint --dialect tsql --format github-annotation --annotation-level failure --nofail ${STEPS_GET_FILES_TO_LINT_OUTPUTS_LINTEES} > annotations.json
        env:
          STEPS_GET_FILES_TO_LINT_OUTPUTS_LINTEES: ${{ steps.get_files_to_lint.outputs.lintees }}
      - name: Annotate
        uses: yuzutech/annotations-action@v0.3.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          title: "SQLFluff Lint"
          input: "./annotations.json"
